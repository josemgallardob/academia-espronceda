[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "academia-espronceda-solver"
version = "1.0.0"
description = "Scheduling solver service for Academia Espronceda"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.140.6,<0.141",
    "ortools>=9.15.0,<10",
    "uvicorn[standard]>=0.51.0,<0.52",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.0,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/academia_espronceda_solver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
