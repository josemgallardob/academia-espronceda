# Production topology for Academia Espronceda on Render (frankfurt).
# Secrets stay in the dashboard (sync: false). DE-05 applies this blueprint.
previews:
  generation: off

services:
  - type: web
    runtime: node
    name: academia-espronceda-web
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: npm ci && npm run build:web && npm run build:api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:prod:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: AUTH_COOKIE_NAME
        value: __Host-academia_session
      - key: XSRF_COOKIE_NAME
        value: XSRF-TOKEN
      - key: JWT_ISSUER
        value: academia-espronceda-api
      - key: JWT_AUDIENCE
        value: academia-espronceda-web
      - key: JWT_TTL_SECONDS
        value: '36000'
      - key: SOLVER_URL
        value: http://academia-espronceda-solver:8001
      - fromGroup: academia-espronceda-production

  - type: pserv
    runtime: python
    name: academia-espronceda-solver
    region: frankfurt
    plan: standard
    branch: main
    autoDeployTrigger: commit
    buildCommand: python -m pip install --upgrade pip && python -m pip install -e apps/solver
    startCommand: python -m academia_espronceda_solver
    envVars:
      - key: NODE_ENV
        value: production
      - key: SOLVER_HOST
        value: 0.0.0.0
      - key: SOLVER_PORT
        value: '8001'
      - fromGroup: academia-espronceda-production
